<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Gerador de Rótulos Isadora Andrade</title>

<link rel="icon" type="image/png" sizes="16x16" href="../imagens/favicon-16x16.png">

<link rel="shortcut icon" href="../imagens/favicon.ico">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: bancada de trabalho — passo a passo à esquerda/topo, prévia do rótulo em "papel" branco, números em mono */
:root{
  --bg:#f3f5f1; --surface:#ffffff; --surface-2:#eef1ec; --ink:#16201a; --muted:#5b685f; --line:#d6dcd5;
  --accent:#1b6a50; --accent-ink:#ffffff; --accent-soft:#e1eee7; --warn:#9a5b00; --warn-soft:#fbf0dc; --bad:#b3261e; --bad-soft:#fbe5e2;
  --paper:#ffffff; --paper-ink:#000000;
  --f-ui:"Instrument Sans", "Segoe UI", system-ui, sans-serif; --f-num:"JetBrains Mono", ui-monospace, Consolas, monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111613; --surface:#18201b; --surface-2:#1f2822; --ink:#e4ebe6; --muted:#98a69d; --line:#2d3831;
  --accent:#5cc39a; --accent-ink:#0b1510; --accent-soft:#1c3328; --warn:#e9b25a; --warn-soft:#2f2615; --bad:#f08a80; --bad-soft:#3a1d1a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111613; --surface:#18201b; --surface-2:#1f2822; --ink:#e4ebe6; --muted:#98a69d; --line:#2d3831;
  --accent:#5cc39a; --accent-ink:#0b1510; --accent-soft:#1c3328; --warn:#e9b25a; --warn-soft:#2f2615; --bad:#f08a80; --bad-soft:#3a1d1a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:20px 60px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:1.45rem;font-weight:700;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:650}
h3{font-size:.95rem;font-weight:650}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.84rem}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
header.top{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.brand{display:flex;flex-direction:column;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.78rem;font-weight:600;white-space:nowrap}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.neutral{background:var(--surface-2);color:var(--muted)}
button,.btn{font:inherit;cursor:pointer;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;font-weight:550;font-size:.9rem}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:6px 8px}
button.danger{color:var(--bad)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.steps{display:flex;gap:4px;overflow-x:auto;margin-bottom:18px;padding-bottom:2px}
.steps button{border:none;background:transparent;padding:10px 12px;border-bottom:2px solid var(--line);border-radius:0;color:var(--muted);white-space:nowrap;display:flex;gap:8px;align-items:center}
.steps button .n{font-family:var(--f-num);font-size:.8rem;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;background:var(--surface-2)}
.steps button.on{color:var(--ink);border-bottom-color:var(--accent)}
.steps button.on .n{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px 16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px 14px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;font-weight:600;color:var(--muted);min-width:0}
label.f.span2{grid-column:1/-1}
input[type=text],input[type=number],input[type=email],input[type=password],select,textarea{font:inherit;font-size:.93rem;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:64px;resize:vertical}
input.n{font-family:var(--f-num);text-align:right}
.check{display:flex;gap:8px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px;accent-color:var(--accent)}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.type{text-align:left;padding:18px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:10px;min-height:170px}
.type:hover{border-color:var(--accent)}
.type .glyph{width:46px;height:46px}
.type b{font-size:1.05rem}
.type .ex{font-size:.82rem;color:var(--muted)}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.list .it{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.list .it:first-child{border-top:none}
.ing{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ing>summary{list-style:none;cursor:pointer;padding:12px 14px;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.ing>summary::-webkit-details-marker{display:none}
.ing[open]>summary{border-bottom:1px solid var(--line)}
.ing .idx{font-family:var(--f-num);font-size:.8rem;color:var(--muted)}
.ing .nm{font-weight:600;overflow-wrap:anywhere}
.ing .meta{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.ing .body{padding:14px;display:flex;flex-direction:column;gap:16px}
.compgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px 10px}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ac{position:relative}
.ac-list{position:absolute;z-index:20;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:8px;max-height:280px;overflow:auto;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.ac-list button{display:block;width:100%;text-align:left;border:none;border-radius:0;border-top:1px solid var(--line);padding:8px 10px;font-weight:400;font-size:.86rem}
.ac-list button:first-child{border-top:none}
.ac-list .s{font-family:var(--f-num);font-size:.74rem;color:var(--muted)}
.alg{display:flex;flex-wrap:wrap;gap:6px}
.alg .tag{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 10px;font-size:.82rem;background:var(--surface-2)}
.alg .tag button{border:none;padding:0 6px;background:transparent;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.calc{border-collapse:collapse;width:100%;font-size:.85rem}
table.calc th,table.calc td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
table.calc th:first-child,table.calc td:first-child{text-align:left}
table.calc thead th{border-top:none;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
table.calc td.num{font-family:var(--f-num)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{border-radius:8px;padding:10px 12px;font-size:.88rem;display:flex;gap:10px}
.alert.err{background:var(--bad-soft);color:var(--bad)}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.alert b{font-weight:650}
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.paper{background:var(--paper);color:var(--paper-ink);border-radius:10px;padding:18px;overflow-x:auto;border:1px solid var(--line)}
.paper svg{display:block}
.paper.fit svg{max-width:100%;height:auto}
@media (max-width:560px){.ing>summary{grid-template-columns:28px minmax(0,1fr)}.ing .meta{grid-column:2;justify-content:flex-start}}
.paper-cap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:8px}
.decl{font-family:Arial, Helvetica, "Liberation Sans", sans-serif;color:#000;font-size:13px;line-height:1.35}
.decl .w{font-weight:700;text-transform:uppercase;margin-top:6px}
.kv{display:grid;grid-template-columns:minmax(120px,auto) 1fr;gap:6px 14px;font-size:.88rem}
.kv dt{color:var(--muted);font-weight:600}
.kv dd{margin:0;overflow-wrap:anywhere}
.exports{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.exports button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px}
.exports button small{font-weight:400;color:var(--muted);font-size:.78rem}
.exports button .fmt{font-family:var(--f-num);font-size:.72rem;color:var(--accent);font-weight:600}
.navbar{display:flex;justify-content:space-between;gap:10px;margin-top:18px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9rem;z-index:50;max-width:calc(100% - 32px)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;border-radius:0;border-left:1px solid var(--line);padding:7px 12px;font-weight:500}
.seg button:first-child{border-left:none}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.mini{font-size:.78rem;padding:5px 9px}
.sumline{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.86rem}
.sumline b{font-family:var(--f-num)}
@media (prefers-reduced-motion:no-preference){.card,.type{transition:border-color .15s}}
</style>

<div class="wrap" id="app"></div>
<div class="toast" id="toast" hidden></div>

function compOf(ing){
  const c={}; KEYS.forEach(k=>c[k]=nz(ing.comp[k]));

}
function somar(list){

// Anexo III, IN 75/2020
function arred(v,u){
  if(!(v>0)) return "0";
  if(v>=10) return String(rhu(v,0));
  if(v>=1){const r=rhu(v,1); return Number.isInteger(r)?String(r):brFix(r,1)}

  const r=rhu(v,2); if(r>=1) return String(r).replace(".",","); if(r===0) return "0";
  return Math.round(r*100)%10===0?brFix(r,1):brFix(r,2);
}

const RE_ESP2=new RegExp("\\b(?:"+[...GEN_AMBIGUOS].join("|")+")\\b"+EPITETO,"g");
const grafiaCientifica=m=>{const w=m.split(/(\s+)/);w[0]=w[0].charAt(0).toUpperCase()+w[0].slice(1).toLowerCase();for(let i=1;i<w.length;i++)w[i]=w[i].toLowerCase();return w.join("")};
function marcarEspecies(s){
  // trechos já marcados pelo usuário com _..._ ficam como estão
  return String(s).split(/(_[^_]+_)/).map(p=>p.length>2&&p.startsWith("_")&&p.endsWith("_")?p:p.replace(RE_ESP1,m=>"_"+grafiaCientifica(m)+"_").replace(/_[^_]+_|[^_]+/g,q=>q.startsWith("_")?q:q.replace(RE_ESP2,m=>"_"+m+"_"))).join("");
}
function parseRich(s){const out=[];String(s||"").split(/(_[^_]+_)/).forEach(p=>{if(!p)return;if(p.length>2&&p.startsWith("_")&&p.endsWith("_"))out.push({t:p.slice(1,-1),i:true});else out.push({t:p,i:false})});return out}
const semMarcas=s=>String(s||"").replace(/_([^_]+)_/g,"$1");

function caixaIngredientes(s){
  const runs=parseRich(s).map(r=>r.i?r:{t:r.t.toLocaleLowerCase("pt-BR").replace(/\bins\b/g,"INS"),i:false});
  for(const r of runs){const k=r.t.search(/\S/); if(k<0) continue; if(!r.i) r.t=r.t.slice(0,k)+r.t.charAt(k).toLocaleUpperCase("pt-BR")+r.t.slice(k+1); break}

function textos(R,C){

function uniao(rects){ // contorno (polígono ortogonal) e área da união de retângulos
  const xs=[...new Set(rects.flatMap(r=>[r[0],r[2]]))].sort((a,b)=>a-b), ys=[...new Set(rects.flatMap(r=>[r[1],r[3]]))].sort((a,b)=>a-b);

function caminhoArredondado(P,r){const K=0.5523,d=[];const n=P.length;

function svgOf(lay,pxPerMM){

    else if(o.t==="circle") s+=`<circle cx="${o.cx}" cy="${o.cy}" r="${o.r}" fill="none" stroke="${o.stroke}" stroke-width="${o.sw}"/>`;
    else if(o.t==="poly") s+=`<polygon points="${o.pts.map(p=>p.join(",")).join(" ")}" fill="${o.fill}" stroke="${o.stroke}" stroke-width="${o.sw}" stroke-linejoin="round"/>`;

    else if(o.t==="path") s+=`<path d="${o.d.map(c=>c[0]+(c.length>1?" "+c.slice(1).map(v=>+v.toFixed(4)).join(" "):"")).join(" ")}" fill="${o.fill||"none"}" ${o.stroke?`stroke="${o.stroke}" stroke-width="${o.sw}" stroke-linejoin="round"`:""}/>`;

function pdfDraw(doc,lay,ox,oy){

    if(o.t==="rect"){const st=o.fill&&o.stroke?"FD":o.fill?"F":"S"; if(o.fill){const c=o.fill==="#fff"?255:0;doc.setFillColor(c,c,c)} doc.setDrawColor(0); if(o.stroke)doc.setLineWidth(o.sw);
      if(o.r) doc.roundedRect(ox+o.x,oy+o.y,o.w,o.h,o.r,o.ry||o.r,st); else doc.rect(ox+o.x,oy+o.y,o.w,o.h,st)}

    else if(o.t==="path"){const c=o.fill==="#fff"?255:0; doc.setFillColor(c,c,c); doc.setDrawColor(0); if(o.stroke) doc.setLineWidth(o.sw);
      const st=o.fill&&o.stroke?"FD":o.fill?"F":"S"; let seg=null,sx0=0,sy0=0,cx=0,cy=0; const flush=()=>{if(seg&&seg.length) doc.lines(seg,ox+sx0,oy+sy0,[1,1],st,true); seg=null};

    else if(o.t==="poly"){doc.setFillColor(255,212,0);doc.setDrawColor(0);doc.setLineWidth(o.sw);doc.setLineJoin("round");const p=o.pts;doc.triangle(ox+p[0][0],oy+p[0][1],ox+p[1][0],oy+p[1][1],ox+p[2][0],oy+p[2][1],"FD")}

}

  const cfg=window.CONFIG||{};
  if(!window.supabase||!cfg.SUPABASE_URL) return telaMsg("Sem conexão","Não foi possível carregar a conexão com o banco. Recarregue a página.");
  if(!DBR.sb) DBR.sb=window.supabase.createClient(String(cfg.SUPABASE_URL).trim().replace(/\/rest\/v1\/?$/,"").replace(/\/+$/,""),String(cfg.SUPABASE_ANON_KEY).trim());
  try{
    const {data}=await DBR.sb.auth.getSession(); if(!data.session) return telaLogin();
    DBR.user=data.session.user;
    const m=await DBR.sb.rpc("cons_e_membro"); if(m.error) throw m.error;
    if(m.data!==true) return telaMsg("Sem acesso",`O e-mail ${esc(DBR.user.email)} entrou, mas não está liberado no sistema.`,`<button data-act="sair">Sair</button>`);
    $("#app").innerHTML=`<p class="muted">Carregando…</p>`;
    await Promise.all([carregarLista(),carregarClientes()]);
    S.pronto=true; render();
  }catch(err){console.error(err);
    const semTabela=/cons_rotulos|schema cache|does not exist/i.test(err.message||"");
    telaMsg(semTabela?"Banco ainda não preparado":"Não foi possível carregar",semTabela?"Falta criar a tabela dos rótulos: rode o arquivo 08_rotulos.sql no SQL Editor do Supabase.":esc(err.message||err),`<button onclick="location.reload()">Tentar de novo</button><button data-act="sair">Sair</button>`)}
}

function balSum(C){const X=C.extra;if(!X.massaTanque&&X.massaTanque!==0)return"";return `<span>Tanque: <b>${br(X.massaTanque,1)} g</b></span><span>Produto-base: <b>${br(X.massaBase,1)} g</b></span><span>${esc(S.R.balanco.subproduto||"Subproduto")}: <b>${br(X.massaSub,1)} g</b></span><span>Rendimento: <b>${br(X.rendPct,2)}%</b></span><span>Adicionado depois: <b>${br(X.massaDepois,1)} g</b></span>`}
function concSum(C){const X=C.extra;return `<span>Entrada: <b>${br(X.massaEntrada,1)} g</b></span><span>Água evaporada: <b>${br(X.evaporado,1)} g</b></span><span>Fator de concentração: <b>${br(X.fator,3)}</b></span>`}

function resumoHTML(C){

}

function nomeArq(ext,suf=""){return `${slug(S.R.produto.nome)}${suf?"-"+suf:""}.${ext}`}
async function exportar(tipo){
  const R=S.R,C=calc(R),T=textos(R,C),lup=layLupa(R,C),dec=layDecl(R,C,T); const [tipoBase,modTab]=tipo.split(":"); tipo=tipoBase; const tab=layTabela(R,C,modTab); const tabs=modelosTab(R).map(m=>layTabela(R,C,m));
  try{
    if(tipo==="json") return saveFile(nomeArq("json"),new Blob([JSON.stringify(R,null,2)],{type:"application/json"}));
    if(tipo==="pngTab") return saveFile(nomeArq("png","tabela-"+tab.modelo),(await pngOf(tab)).blob);
    if(tipo==="rel"){ if(!window.jspdf) return toast("A biblioteca de PDF não carregou. Recarregue a página."); toast("Gerando o relatório…"); return saveFile(`dizeres-de-rotulagem-${slug(R.relatorio?.nome||R.produto.nome)}-v${R.relatorio?.versao||1}.pdf`,await relatorioPDF(R,C,T)); }
    if(tipo==="pngLupa") return saveFile(nomeArq("png","lupa"),(await pngOf(lup)).blob);
    if(tipo==="pngDec") return saveFile(nomeArq("png","ingredientes"),(await pngOf(dec)).blob);
    const {jsPDF}=window.jspdf||{}; if((tipo.startsWith("pdf"))&&!jsPDF) return toast("A biblioteca de PDF não carregou. Verifique a internet e recarregue.");
    if(tipo==="pdfTab"||tipo==="pdfLupa"){const L=tipo==="pdfTab"?tab:lup; const m=2; const doc=new jsPDF({unit:"mm",format:[L.w+2*m,L.h+2*m],orientation:L.w>L.h?"l":"p"}); pdfDraw(doc,L,m,m); return saveFile(nomeArq("pdf",tipo==="pdfTab"?"tabela-"+tab.modelo:"lupa"),doc.output("blob"))}
    if(tipo==="pdf") return saveFile(nomeArq("pdf","ficha"),await pdfFicha(R,C,T,tabs,lup,dec));
    if(tipo==="xlsx") return saveFile(nomeArq("xlsx"),await excel(R,C,T,tabs,lup,dec));
  }catch(e){console.error(e);toast("Não foi possível gerar o arquivo: "+(e.message||e))}
}
/* mesmo estilo dos documentos do sistema (extrato de horas): faixa laranja, logo, título escuro, rodapé com data e página */
const LARANJA=[226,102,26], TINTA=[30,43,39], CINZA=[86,100,94], LINHA=[220,226,222], CLARO=[253,238,226];
let logoCache;
function carregarLogo(){
  return (logoCache||=new Promise(ok=>{
    const img=new Image();
    img.onload=()=>{try{
      const cv=document.createElement("canvas"); cv.width=cv.height=280;
      const g=cv.getContext("2d"); g.fillStyle="#fff"; g.fillRect(0,0,280,280); g.drawImage(img,0,0,280,280);
      const url=cv.toDataURL("image/jpeg",0.9); ok({url,b64:url.split(",")[1]}); // fundo branco + JPEG: arquivo leve
    }catch{ok(null)}};
    img.onerror=()=>ok(null); img.src="../imagens/logo.png";
  }));
}

function escalar(lay,k){const sc=o=>{const n={...o};["x","y","w","h","x1","y1","x2","y2","cx","cy","r","ry","sw","size"].forEach(a=>{if(n[a]!=null)n[a]*=k});if(n.pts)n.pts=n.pts.map(p=>p.map(v=>v*k));if(n.d)n.d=n.d.map(c=>c.length>1?[c[0],...c.slice(1).map(v=>v*k)]:c);return n};
  return {...lay,w:lay.w*k,h:lay.h*k,ops:lay.ops.map(sc)}}

/* ===================== AUTOCOMPLETE ===================== */
let acBox=null;
function closeAC(){if(acBox){acBox.remove();acBox=null}}
function showAC(input,items,onPick){
  closeAC(); if(!items.length) return; acBox=document.createElement("div"); acBox.className="ac-list";
  acBox.innerHTML=items.map((it,i)=>`<button type="button" data-i="${i}">${esc(it.t)}${it.s?`<br><span class="s">${esc(it.s)}</span>`:""}</button>`).join("");
  acBox.addEventListener("mousedown",e=>{const b=e.target.closest("button");if(!b)return;e.preventDefault();onPick(items[+b.dataset.i]);closeAC()});
  input.closest(".ac").appendChild(acBox);
}
function busca(lista,q,fn,max=12){const f=fold(q).split(/\s+/).filter(Boolean);if(!f.length)return[];const out=[];for(const x of lista){const t=fold(fn(x));if(f.every(w=>t.includes(w))){out.push(x);if(out.length>=max)break}}return out}

  const C=calc(S.R); const r=$("#resumo"); if(r) r.innerHTML=resumoHTML(C);
  const b=$("#balsum"); if(b) b.innerHTML=balSum(C); const c=$("#concsum"); if(c) c.innerHTML=concSum(C);
}

  if(/^ingredientes\.\d+\.(nome|qtd)$/.test(p)){const d=el.closest("details.ing"); if(d){const ix=+p.split(".")[1];const i=S.R.ingredientes[ix];const tot=S.R.ingredientes.reduce((a,x)=>a+nz(x.qtd),0);const nm=d.querySelector(".nm");if(nm)nm.textContent=i.nome||"Novo ingrediente";const sm=d.querySelector("summary .small");if(sm)sm.textContent=`${i.qtd?br(nz(i.qtd),3)+" g":"sem quantidade"} · ${br(tot?nz(i.qtd)/tot*100:0,2)}%`}}
  if(el.dataset.ibge!=null){const ix=+el.dataset.ibge; const r=busca(IBGE,el.value,x=>x[0]);
    showAC(el,r.map(x=>({t:x[0],s:`carb ${br(x[1])} · prot ${br(x[4])} · gord ${br(x[5])} · sódio ${br(x[9])} mg`,x})),it=>{

  if(el.dataset.anexo){const r=busca(ANEXO5,el.value,x=>x[1]+" "+x[0]);

});
